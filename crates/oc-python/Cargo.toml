[package]
name = "oc-python"
description = "OpenConverter: Python bindings (PyO3, abi3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
oc-core = { path = "../oc-core" }
oc-engine = { path = "../oc-engine" }
pyo3 = { version = "0.30", features = ["abi3-py39", "extension-module"] }

[lints]
workspace = true
