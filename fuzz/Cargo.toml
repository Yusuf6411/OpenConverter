[package]
name = "oc-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oc-core = { path = "../crates/oc-core" }
oc-compress = { path = "../crates/oc-compress" }
oc-text = { path = "../crates/oc-text" }
oc-xml = { path = "../crates/oc-xml" }
oc-image = { path = "../crates/oc-image" }
oc-vp8 = { path = "../crates/oc-vp8" }
oc-theora = { path = "../crates/oc-theora" }
oc-vp9 = { path = "../crates/oc-vp9" }
oc-prores = { path = "../crates/oc-prores" }
oc-video = { path = "../crates/oc-video" }
oc-font = { path = "../crates/oc-font" }
oc-raster = { path = "../crates/oc-raster" }
oc-svg = { path = "../crates/oc-svg" }
oc-pdf = { path = "../crates/oc-pdf" }
oc-document = { path = "../crates/oc-document" }
oc-sheet = { path = "../crates/oc-sheet" }
oc-archive = { path = "../crates/oc-archive" }
oc-audio = { path = "../crates/oc-audio" }
oc-subtitle = { path = "../crates/oc-subtitle" }
oc-container = { path = "../crates/oc-container" }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

