name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q openconverter
      - name: Tests
        run: python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Report failing tests as annotations
        if: failure()
        run: python scripts/ci_annotate.py test-output.txt
      - name: Release verifier
        run: python scripts/verify_release.py --ci
