[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
deny = [
  { name = "reqwest", wrappers = ["tauri"] }, { name = "ureq" }, { name = "curl" }, { name = "isahc" }, { name = "attohttpc" },
  { name = "image" }, { name = "png", wrappers = ["tauri-utils", "tauri-codegen", "tauri", "ico", "tauri-build", "muda"] }, { name = "flate2", wrappers = ["tauri-utils", "tauri-codegen", "png", "tauri-build", "tauri"] }, { name = "miniz_oxide", wrappers = ["flate2", "png"] }, { name = "zstd" },
  { name = "zip" }, { name = "tar" }, { name = "quick-xml", wrappers = ["plist", "tauri-utils"] }, { name = "encoding_rs" }, { name = "lopdf" },
]

[advisories]
# Unmaintained notices for crates inside the Tauri/GTK desktop shell only (ADR-0005).
ignore = [{ id = "RUSTSEC-2024-0370", reason = "proc-macro-error, build-time macro in the GTK bindings used by the desktop shell" }]
