[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openconverter"
dynamic = ["version"]
description = "Convert anything. Keep everything local. An offline file converter with zero dependencies."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yusuf" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
openconverter = "openconverter.cli:main"

[tool.setuptools.dynamic]
version = { attr = "openconverter.__version__" }

[tool.setuptools.packages.find]
include = ["openconverter*"]
